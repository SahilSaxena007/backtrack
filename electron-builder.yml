appId: com.backtrack.app
productName: Backtrack
directories:
  output: release
  buildResources: resources
files:
  - "dist/**/*"
  - "package.json"
extraMetadata:
  main: dist/main/main/main.js
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - portable
linux:
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
